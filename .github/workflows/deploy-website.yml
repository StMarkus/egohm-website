name: Deploy Website to GitHub Pages

# Statische Promo-Website aus `website/` — kein Build-Schritt, der Ordner wird
# unverändert als Pages-Artefakt hochgeladen.
on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

# `pages: write` + `id-token: write` sind für actions/deploy-pages Pflicht.
permissions:
  contents: read
  pages: write
  id-token: write

# Parallele Deploys vermeiden, laufende aber nicht abbrechen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Jekyll überspringen (Ordner/Dateien mit `_` würden sonst ignoriert).
      - name: Disable Jekyll processing
        run: touch website/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
